name: CI

# The whole product is three files and a service. There is no excuse for the
# tests to run by hand, and every claim in the README should be checkable by a
# machine on every push.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: spacesd (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Two versions so a stdlib API that moved gets caught. 3.9 was tried
        # first and does not exist on ubuntu-latest any more; asking for a
        # version that cannot resolve tests nothing.
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Byte-compile first
        run: python -m compileall -q spacesd.py test_spacesd.py
      - name: Run the suite
        run: python test_spacesd.py

  shell:
    name: shell is self-contained
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: No external network references
        # Offline-capable is a product claim, not a preference. If a font or a
        # script ever gets pulled from a remote host, this fails.
        run: |
          python - <<'PY'
          import re, sys
          html = open('index.html', encoding='utf-8').read()
          refs = re.findall(r'(?:src|href)\s*=\s*"(https?://[^"]+)"', html)
          if refs:
              print("external references found:")
              for r in refs:
                  print("  -", r)
              sys.exit("index.html must be self-contained")
          print("no external references — self-contained")
          PY

      - name: Extract the inline script
        run: |
          python - <<'PY'
          import re
          html = open('index.html', encoding='utf-8').read()
          m = re.search(r'<script>(.*?)</script>', html, re.S)
          assert m, "no inline script found"
          open('/tmp/ui.js', 'w', encoding='utf-8').write(m.group(1))
          print(f"extracted {len(m.group(1))} chars of JS")
          PY

      - name: JavaScript parses
        run: node --check /tmp/ui.js

      - name: Tag balance
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          VOID = {'meta','link','br','img','input','hr','source','canvas','area',
                  'base','col','embed','param','track','wbr'}
          class P(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True); self.stack=[]; self.errs=[]
              def handle_starttag(self, t, a):
                  if t not in VOID: self.stack.append(t)
              def handle_endtag(self, t):
                  if t in VOID: return
                  if not self.stack: self.errs.append(f'extra </{t}>'); return
                  if self.stack[-1] == t: self.stack.pop()
                  else: self.errs.append(f'expected </{self.stack[-1]}> got </{t}>')
          p = P(); p.feed(open('index.html', encoding='utf-8').read())
          if p.errs or p.stack:
              print("errors:", p.errs); print("unclosed:", p.stack)
              raise SystemExit("index.html has unbalanced tags")
          print("tags balanced")
          PY

  licence:
    name: licence is intact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: LICENSE is the AGPL and nothing else
        # A truncated or hand-edited licence file is worse than none: it looks
        # like a grant it isn't. This fails if the file is not the real text.
        run: |
          python - <<'PY'
          import sys
          text = open('LICENSE', encoding='utf-8').read()
          need = [
              'GNU AFFERO GENERAL PUBLIC LICENSE',
              'Version 3, 19 November 2007',
              'TERMS AND CONDITIONS',
              'How to Apply These Terms to Your New Programs',
          ]
          missing = [n for n in need if n not in text]
          if missing:
              print("LICENSE is missing:", missing)
              sys.exit(1)
          if len(text) < 30000:
              sys.exit(f"LICENSE looks truncated: {len(text)} bytes")
          print(f"LICENSE intact: {len(text)} bytes")
          PY
